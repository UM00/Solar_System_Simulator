# Keeps README.md in sync with the code.
# On every push that touches Python files, it re-runs docs/build_readme.py
# (standard library only, so no installs and it finishes in seconds) and
# commits README.md if the generated parts changed.
# Commits made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
name: Update README

on:
  push:
    branches: [master, main]
    paths: ["**.py", "README.md", "docs/validation.json"]
  workflow_dispatch:        # also runnable by hand from the Actions tab

permissions:
  contents: write           # needed to push the refreshed README

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Regenerate README
        run: python docs/build_readme.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: auto-update README from code"
            git push
          fi
